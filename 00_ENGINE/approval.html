<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>JARVIS: Approval</title>
  <style>
    :root {
      --bg: #0B1220; --surface: #111827; --text: #F3F4F6; --muted: #9CA3AF;
      --cyan: #06B6D4; --warn: #F59E0B; --error: #EF4444; --success: #22C55E;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', 'Segoe UI', sans-serif; }
    html, body { height: 100%; background: var(--bg); color: var(--text); }
    body { padding: 20px; }
    .card[hidden] { display: none; }
    .card {
      background: rgba(17, 24, 39, 0.92); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; padding: 20px; height: 100%; display: flex; flex-direction: column; gap: 12px;
    }
    header { display: flex; justify-content: space-between; align-items: center; }
    .badge {
      font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
      background: rgba(245,158,11,0.15); color: var(--warn); border: 1px solid rgba(245,158,11,0.4);
    }
    .presence { font-size: 12px; color: var(--muted); }
    h1 { font-size: 18px; font-weight: 600; }
    dl { display: grid; grid-template-columns: 90px 1fr; gap: 6px 12px; font-size: 13px; }
    dt { color: var(--muted); }
    dd { word-break: break-word; font-family: Consolas, 'Courier New', monospace; }
    .note {
      font-size: 12px; color: var(--warn); background: rgba(245,158,11,0.08);
      border-radius: 8px; padding: 8px 10px;
    }
    .note[hidden] { display: none; }
    .timer { font-size: 13px; color: var(--muted); }
    .timer span { color: var(--cyan); font-weight: 700; }
    .bar { height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
    #bar { height: 100%; width: 100%; background: var(--cyan); transition: width 0.1s linear; }
    .actions { margin-top: auto; display: flex; gap: 12px; }
    .btn {
      flex: 1; padding: 10px 14px; border-radius: 10px; font-size: 14px; font-weight: 600;
      cursor: pointer; border: 1.5px solid transparent;
    }
    .btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .reject { background: rgba(239,68,68,0.12); color: var(--error); border-color: rgba(239,68,68,0.45); }
    .approve { background: rgba(34,197,94,0.12); color: var(--success); border-color: rgba(34,197,94,0.45); }
    .hint { font-size: 11px; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <main class="card" id="card" hidden>
    <header>
      <span class="badge" id="risk">RISKY</span>
      <span class="presence" id="presence"></span>
    </header>
    <h1>Approval needed</h1>
    <dl>
      <dt>Module</dt><dd id="module"></dd>
      <dt>Action</dt><dd id="action"></dd>
      <dt>Target</dt><dd id="target"></dd>
      <dt>Summary</dt><dd id="summary"></dd>
    </dl>
    <p class="note" id="idleNote" hidden>
      No recent input from you. Telegram is not connected yet, so this popup is the only way to answer.
    </p>
    <div class="timer">Auto-reject in <span id="secs">--</span>s</div>
    <div class="bar"><div id="bar"></div></div>
    <div class="actions">
      <button class="btn reject" id="reject">Reject</button>
      <button class="btn approve" id="approve" disabled>Approve</button>
    </div>
    <p class="hint">Esc = Reject. Approve unlocks after 1.5 seconds.</p>
  </main>
  <script src="approval.js"></script>
</body>
</html>
